name: ezcirkit_app
description: "EZCirkit Mobile IDE & Compiler Platform - Connect, compile, and flash Arduino Uno boards directly from your mobile device."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  usb_serial: ^0.5.2
  youtube_player_flutter: 8.1.2
  google_fonts: ^6.2.1
  provider: ^6.1.2
  photo_view: ^0.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
